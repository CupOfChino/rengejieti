<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人格解体 · 特效预览器</title>
<style>
:root { color-scheme: dark; font: 15px/1.5 "Microsoft YaHei", system-ui, sans-serif; background: #13171a; color: #eee8db; }
* { box-sizing: border-box; }
body { margin: 0; }
main { width: min(1160px, 100% - 40px); margin: 36px auto; }
h1 { margin: 0 0 18px; font-size: 27px; font-weight: 620; }
h2 { margin: 0 0 16px; font-size: 16px; }
section { display: grid; grid-template-columns: minmax(0,1fr) 304px; gap: 16px; align-items: start; }
.stage, aside { border: 1px solid #484338; border-radius: 12px; background: #1b2023; overflow: hidden; }
canvas { width: 100%; aspect-ratio: 880 / 480; display: block; background: #191f24; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; padding: 12px; border-top: 1px solid #484338; }
aside { padding: 17px; }
input, button, select { font: inherit; }
button, select, input[type=number] { padding: 6px 9px; border: 1px solid #5c5a4e; border-radius: 6px; background: #262d30; color: inherit; }
button { cursor: pointer; }
button:hover, select:hover { border-color: #d0a86d; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #addec7; outline-offset: 2px; }
button.primary { color: #172523; background: #b0ddc6; border-color: #b0ddc6; font-weight: 650; }
.field { display: grid; grid-template-columns: 82px 1fr 67px; align-items: center; gap: 8px; margin-bottom: 13px; }
.field input[type=range] { width: 100%; min-width: 0; accent-color: #a9d8bc; }
.field input[type=number] { width: 67px; }
[hidden] { display: none !important; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
p { margin: 12px 0 0; color: #b6bbb6; font-size: 13px; }
#state { margin-left: auto; color: #b6bbb6; font-size: 13px; }
code { font-size: 12px; overflow-wrap: anywhere; }
@media (max-width: 850px) { main { width: calc(100% - 24px); margin: 18px auto; } section { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
<h1>人格解体 · 特效预览器</h1>
<section aria-label="预览与参数">
  <div class="stage">
    <canvas id="stage" width="880" height="480" aria-label="茉莉和所选特效的预览"></canvas>
    <div class="bar">
      <select id="effect" aria-label="选择特效">
        <option value="flower">花香</option><option value="wind">灰暗孤影</option>
        <option value="lockMark">目标锁定</option><option value="thrust">荆棘 · 三连刺</option>
        <option value="slash">葬花 · 单体斩击</option><option value="sweep">葬花 · 横扫</option>
      </select>
      <button type="button" id="replay">重播</button>
      <button type="button" id="facing" hidden>换来向</button>
      <span id="state" role="status">载入贴图中</span>
    </div>
  </div>
  <aside>
    <h2>位置与角度</h2>
    <div id="fields"></div>
    <p>横向正值往右，纵向正值往上。1.00 等于一个身高。角度正值逆时针。</p>
    <div class="actions">
      <button type="button" class="primary" id="save">导出参数</button>
      <button type="button" id="open">导入</button>
      <button type="button" id="reset">恢复当前默认</button>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </div>
    <p>游戏使用时，把导出的 <code>VfxPlacement.json</code> 放在测试版插件 DLL 的同一目录，重启游戏。</p>
  </aside>
</section>
</main>
<script id="bundle" type="application/json">__VFX_PREVIEW_BUNDLE__</script>
<script>
"use strict";
const bundle = JSON.parse(document.getElementById("bundle").textContent);
const defaults = bundle.defaults;
const settings = structuredClone(defaults);
const effect = document.getElementById("effect");
const state = document.getElementById("state");
const stage = document.getElementById("stage");
const ctx = stage.getContext("2d");
const config = {
  x: ["横向 X", -1, 1, 0.01], y: ["纵向 Y", -1, 1, 0.01],
  angle: ["角度 °", -180, 180, 1], spread: ["横向散开", 0.25, 1.2, 0.01]
};
const clamp = (v, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = v => { const t = clamp(v); return t * t * (3 - 2 * t); };
const radians = Math.PI / 180;
const foot = { x: 440, y: 336 };
const h = 141;
const halfWidth = 0.40;
const bodyCenter = (0.5 - 0.45) / 0.90;
const petalKeys = ["petal", "round", "curled"];
const textures = {};
let facing = 1;
let started = performance.now();

function loadTexture(url, point, raw) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.onerror = reject;
    image.onload = () => {
      if (raw) return resolve({ image, point, x: 0, y: 0, w: image.width, h: image.height, ppu: image.height });
      const scan = document.createElement("canvas");
      scan.width = image.width;
      scan.height = image.height;
      const layer = scan.getContext("2d", { willReadFrequently: true });
      layer.drawImage(image, 0, 0);
      const rgba = layer.getImageData(0, 0, scan.width, scan.height).data;
      const threshold = point ? 96 : 24;
      let left = scan.width, top = scan.height, right = -1, bottom = -1;
      for (let y = 0; y < scan.height; y++) {
        for (let x = 0; x < scan.width; x++) {
          if (rgba[(y * scan.width + x) * 4 + 3] < threshold) continue;
          left = Math.min(left, x); right = Math.max(right, x);
          top = Math.min(top, y); bottom = Math.max(bottom, y);
        }
      }
      if (right < left || bottom < top) return reject(new Error("没有可见像素"));
      const x = Math.max(0, left - 6), y = Math.max(0, top - 6);
      const w = Math.min(scan.width, right + 7) - x, h = Math.min(scan.height, bottom + 7) - y;
      resolve({ image, point, x, y, w, h, ppu: Math.max(w, h) });
    };
    image.src = url;
  });
}

function sprite(key, x, y, scaleX, scaleY, angle, alpha, mirrorX = false, mirrorY = false, reveal = 1) {
  if (alpha <= 0 || reveal <= 0) return;
  const tex = textures[key];
  const slices = Math.ceil(clamp(reveal) * 16);
  const crop = slices === 16 ? tex.w : Math.max(1, Math.floor(tex.w * slices / 16));
  const unitX = scaleX * h / tex.ppu, unitY = scaleY * h / tex.ppu;
  ctx.save();
  ctx.globalAlpha = clamp(alpha);
  ctx.imageSmoothingEnabled = !tex.point;
  ctx.translate(x * h, -y * h);
  ctx.rotate(-angle * radians);
  ctx.scale(mirrorX ? -1 : 1, mirrorY ? -1 : 1);
  ctx.drawImage(tex.image, tex.x, tex.y, crop, tex.h,
    -tex.w * unitX / 2, -tex.h * unitY / 2, crop * unitX, tex.h * unitY);
  ctx.restore();
}

function ambientSprite(layout, key, x, y, w, height, angle, alpha) {
  sprite(key, x + layout.x, y + layout.y, w, height, angle + layout.angle, alpha);
}

function character(x) {
  const model = textures.model.image;
  const width = h / 0.90, height = width * model.height / model.width;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(model, x * h - 0.45 * width, -height, width, height);
}

function flower(s, t, behind) {
  if (behind) {
    for (let i = 0; i < 2; i++) {
      const p = (t * 0.3 + i * 0.5) % 1, side = i * 2 - 1;
      const x = bodyCenter + side * (halfWidth + 0.02 + 0.14 * p) * s.spread;
      const size = lerp(0.27, 0.41, p);
      ambientSprite(s, "mist", x, lerp(0.13, 0.49, p), size, size,
        side * (15 + 16 * p), 0.32 * Math.sin(p * Math.PI));
    }
  }
  for (let i = 0; i < 8; i++) {
    if ((i % 3 === 2) !== behind) continue;
    const p = (t / 2.46 + i / 8) % 1, side = i % 2 === 0 ? 1 : -1;
    const phase = i * 2.39, wobble = Math.sin(p * 9 + phase);
    const x = bodyCenter + s.spread * (side * (halfWidth + 0.04 + 0.11 * p) + 0.05 * wobble);
    const size = 0.060 + (i % 3) * 0.015, alpha = clamp(p * 7) * clamp((1 - p) * 5) * 0.83;
    ambientSprite(s, petalKeys[i % 3], x, lerp(0.62 + (i % 4) * 0.05, -0.015, p),
      size * (0.67 + 0.33 * Math.abs(Math.cos(p * 7 + phase))), size,
      (i % 4) * 40 - 60 + side * p * 140 + wobble * 22, alpha);
  }
}

function wind(s, t, behind) {
  const radius = (halfWidth + 0.15) * s.spread, rise = 0.105;
  for (let i = 0; i < 2; i++) {
    const phase = t * 1.8 + i * Math.PI, across = Math.cos(phase), depth = Math.sin(phase);
    if ((depth > 0) !== behind) continue;
    const size = i === 0 ? 0.43 : 0.33;
    ambientSprite(s, "wind", bodyCenter + radius * across, 0.16 + i * 0.085 + rise * depth,
      size, size * 1.75, Math.atan2(rise * across, -radius * depth) / radians,
      lerp(0.48, 0.70, Math.max(0, -depth)));
  }
}

function targetLock(s, t) {
  const tex = textures.lockMark, remaining = 1 - clamp(t / 0.2);
  const settle = 1 + 0.18 * remaining * remaining;
  ambientSprite(s, "lockMark", bodyCenter, 0.50, (1 / 0.9 + 0.28) * tex.ppu / tex.w * settle,
    1.32 * tex.ppu / tex.h * settle, 0, 0.86 + 0.14 * remaining);
}

function thrust(t) {
  if (t < 0 || t >= 1) return;
  const reveal = ease(t / 0.35), trail = ease((t - 0.12) / 0.32);
  const x = facing * lerp(-0.42, 0.23, ease(t)), length = 1.72 * lerp(0.83, 1.06, reveal);
  for (let i = 0; i < 4; i++) {
    const late = i >= 2, start = late ? 0.23 : 0.11, p = clamp((t - start) / (1 - start));
    const side = i % 2 === 0 ? -1 : 1;
    const w = lerp(late ? 0.72 : 0.54, late ? 1.45 : 1.16, ease(p));
    sprite("wind", x - facing * (0.20 + p * 0.23), side * lerp(late ? 0.17 : 0.09, late ? 0.47 : 0.35, ease(p)),
      w, w * 2.12, side * facing * (8 + p * 12), Math.sin(p * Math.PI) * (late ? 0.38 : 0.61));
  }
  sprite("thrustEcho", x - facing * 0.18, 0.02, length * 1.10, 1.72 * 1.38, 0,
    trail * (1 - ease((t - 0.48) / 0.49)) * 0.42, facing < 0, false, trail);
  sprite("thrust", x, 0, length, 1.72 * 0.95, 0,
    ease(t / 0.14) * (1 - ease((t - 0.44) / 0.44)), facing < 0, false, reveal);
}

function slash(t, wide) {
  if (t >= 1) return;
  const width = wide ? 4.65 : 1.64;
  const reveal = ease(t / 0.40), echo = ease((t - 0.13) / 0.36), growth = lerp(0.90, 1.13, ease(t));
  const x = facing * lerp(-0.17, 0.29, ease(t)), height = (wide ? 0.85 : width * 0.91) * growth;
  const angle = facing * lerp(-12, 13, ease(t));
  sprite("slashEcho", x - facing * 0.13, -0.10, width * growth * 1.04, height * 0.74, angle - facing * 9,
    echo * (1 - ease((t - 0.55) / 0.39)) * 0.43, facing < 0, true, echo);
  sprite("slash", x, 0, width * growth, height, angle,
    ease(t / 0.12) * (1 - ease((t - 0.43) / 0.31)), facing < 0, true, reveal);
  const petals = wide ? 12 : 8;
  for (let i = 0; i < petals; i++) {
    const start = 0.16 + (i % 4) * 0.042, p = clamp((t - start) / (1 - start));
    const spread = (i + 0.5) / petals * 2 - 1, phase = i * 2.39, f = ease(p);
    const px = spread * width * (0.23 + f * 0.44) + facing * p * 0.28;
    const py = Math.sin(phase) * (0.09 + f * 0.46) + p * 0.64 - p * p * 0.91;
    const size = 0.075 + (i % 3) * 0.017, flip = 0.61 + 0.39 * Math.abs(Math.cos(phase + p * 7));
    const alpha = ease(p * 6) * (1 - ease((p - 0.55) / 0.45));
    sprite(i % 2 === 0 ? "pale" : "bluePale", px, py, size * flip, size, phase * 45 + facing * 190 * p, alpha);
  }
}

function render(now) {
  const t = (now - started) / 1000, mode = effect.value, s = settings[mode];
  ctx.clearRect(0, 0, stage.width, stage.height);
  ctx.fillStyle = "#191f24";
  ctx.fillRect(0, 0, stage.width, stage.height);
  ctx.save();
  ctx.translate(foot.x, foot.y);
  ctx.strokeStyle = "#383d3f";
  ctx.beginPath(); ctx.moveTo(-440, 0.5); ctx.lineTo(440, 0.5); ctx.stroke();
  if (mode === "flower") flower(s, t, true);
  if (mode === "wind") wind(s, t, true);
  if (mode === "sweep") { character(-1.15); character(1.15); } else character(0);
  if (mode === "flower") flower(s, t, false);
  if (mode === "wind") wind(s, t, false);
  if (mode === "lockMark") targetLock(s, t);
  if (mode === "thrust" || mode === "slash" || mode === "sweep") {
    ctx.translate(s.x * h, -(0.5 + s.y) * h);
    const loop = t % 1.6;
    if (mode === "thrust") {
      for (const [i, y] of [0, 0.20, -0.20].entries()) {
        ctx.save();
        ctx.translate(0, -y * h);
        ctx.rotate(-s.angle * radians);
        thrust((loop - i * 0.10) / 0.34);
        ctx.restore();
      }
    } else {
      ctx.rotate(-s.angle * radians);
      slash(loop / 0.66, mode === "sweep");
    }
  }
  ctx.restore();
  requestAnimationFrame(render);
}

function refreshFields() {
  const fields = document.getElementById("fields"), selected = settings[effect.value];
  fields.replaceChildren();
  for (const [key, [label, min, max, step]] of Object.entries(config)) {
    if (!(key in selected)) continue;
    const row = document.createElement("div");
    row.className = "field";
    const caption = document.createElement("label");
    caption.textContent = label;
    caption.htmlFor = key;
    const slider = document.createElement("input"), number = document.createElement("input");
    for (const [input, type] of [[slider, "range"], [number, "number"]]) {
      Object.assign(input, { type, min, max, step, value: selected[key] });
      input.setAttribute("aria-label", label);
      input.addEventListener("input", () => {
        if (input.value === "" || !Number.isFinite(input.valueAsNumber)) return;
        selected[key] = clamp(input.valueAsNumber, min, max);
        (input === slider ? number : slider).value = selected[key];
      });
    }
    number.id = key;
    number.addEventListener("change", () => { number.value = selected[key]; });
    row.append(caption, slider, number);
    fields.append(row);
  }
}

function replay() { started = performance.now(); }
effect.addEventListener("change", () => {
  document.getElementById("facing").hidden = !["thrust", "slash", "sweep"].includes(effect.value);
  refreshFields();
  replay();
});
document.getElementById("replay").onclick = replay;
document.getElementById("facing").onclick = () => { facing *= -1; replay(); };
document.getElementById("reset").onclick = () => {
  settings[effect.value] = structuredClone(defaults[effect.value]);
  refreshFields();
  replay();
};
document.getElementById("save").onclick = () => {
  const url = URL.createObjectURL(new Blob([JSON.stringify(settings, null, 2) + "\n"], { type: "application/json" }));
  const link = document.createElement("a");
  link.href = url;
  link.download = "VfxPlacement.json";
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  state.textContent = "已导出参数";
};
const file = document.getElementById("file");
document.getElementById("open").onclick = () => file.click();
file.onchange = async () => {
  const chosen = file.files[0];
  if (!chosen) return;
  try {
    if (chosen.size > 16384) throw new Error("文件超过 16 KB");
    const imported = JSON.parse(await chosen.text());
    if (!imported || !Object.keys(defaults).some(key => Object.hasOwn(imported, key))) {
      throw new Error("请选择本播放器导出的参数");
    }
    for (const [key, fields] of Object.entries(defaults)) {
      for (const [field, fallback] of Object.entries(fields)) {
        const value = imported[key]?.[field];
        const [, min, max] = config[field];
        settings[key][field] = Number.isFinite(value) ? clamp(value, min, max) : fallback;
      }
    }
    refreshFields();
    state.textContent = "已导入参数";
  } catch (error) {
    state.textContent = "导入失败：" + error.message;
  } finally {
    file.value = "";
  }
};
refreshFields();

function tintTexture(key, red, green, blue) {
  const source = textures[key];
  const tint = document.createElement("canvas");
  tint.width = source.image.width;
  tint.height = source.image.height;
  const paint = tint.getContext("2d", { willReadFrequently: true });
  paint.drawImage(source.image, 0, 0);
  const pixels = paint.getImageData(0, 0, tint.width, tint.height);
  for (let i = 0; i < pixels.data.length; i += 4) {
    pixels.data[i] *= red;
    pixels.data[i + 1] *= green;
    pixels.data[i + 2] *= blue;
  }
  paint.putImageData(pixels, 0, 0);
  return { ...source, image: tint };
}

Promise.all(Object.entries(bundle.assets).map(async ([key, asset]) => {
  textures[key] = await loadTexture(asset.url, asset.point, key === "model");
})).then(() => {
  textures.bluePale = tintTexture("pale", 0.69, 0.87, 1);
  textures.mist = tintTexture("mist", 1, 0.60, 0.78);
  textures.thrustEcho = tintTexture("thrust", 0.62, 1, 0.79);
  textures.slashEcho = tintTexture("slash", 0.62, 1, 0.79);
  state.textContent = "自动循环";
  replay();
  requestAnimationFrame(render);
}).catch(() => { state.textContent = "贴图载入失败"; });
</script>
</body>
</html>
